<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Prooffolio</title>
    <style>
      body {
        margin: 0;
        padding: 48px 20px;
        background: #F4F0E4;
        color: #0B0B0B;
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        border-top: 2px solid #0B0B0B;
        padding-top: 24px;
      }
      .label {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #5B574E;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3.5rem);
        margin: 12px 0;
        line-height: 1.05;
      }
      .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        border: 2px solid #0B0B0B;
        background: #FCFAF3;
        color: #0B0B0B;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="label">PROOFFOLIO · OFFLINE</div>
      <h1>You are offline.</h1>
      <p>Cached micro-lessons and practice drills are still available on this device. Live AI Viva streaming, workbook validation, and passport signing require an internet connection.</p>
      <a class="btn" href="/learn">Open cached lessons</a>
    </main>
  </body>
</html>
